<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <title>Profile autofill fixture</title>
    <style>body{font:16px sans-serif} [role=listitem]{margin:16px} input,select{display:block;width:320px;height:38px}</style>
  </head>
  <body>
    <div id="report"></div>
    <form>
      <div role="listitem"><h2 role="heading">您的姓名</h2><input id="name" type="text" /></div>
      <div role="listitem"><h2 role="heading">Gmail 電子信箱</h2><input id="email" type="email" /></div>
      <div role="listitem"><h2 role="heading">目前就讀大學</h2><input id="university" type="text" /></div>
      <div role="listitem"><h2 role="heading">科系／系所</h2><input id="department" type="text" /></div>
      <div role="listitem"><h2 role="heading">目前年級</h2><select id="grade"><option value="">請選擇</option><option>大一</option><option>大二</option><option>三年級（大三）</option></select></div>
      <div role="listitem"><h2 role="heading">緊急聯絡人姓名</h2><input id="emergency" type="text" /></div>
    </form>
    <script>
      window.__qrSurveyProfile = { name: "王小明", email: "ming@gmail.com", university: "國立臺灣海洋大學", department: "資訊工程學系", grade: "大三" };
      window.QRSurveyNative = { report(raw) { const report = document.getElementById("report"); report.dataset.result = raw; report.textContent = raw; } };
    </script>
    <script src="../../android/app/src/main/assets/profile_matching.js"></script>
    <script src="../../android/app/src/main/assets/form_autofill.js"></script>
  </body>
</html>
